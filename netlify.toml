# Netlify Configuration for RakhtKhoj
[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Ensures refreshing on any route forwards to index.html with a 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and PWA Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
